[package]
name = "any2epub-rs"
version = "0.9.0"
edition = "2021"
authors = ["any2epub-rs Contributors"]
description = "Conversor Universal Multi-Engine (PDF, mdBook, MediaWiki, MDN Yari, Pro Git AsciiDoc, Sphinx & Go Spec) para W3C EPUB 3.3 com Extração Profunda na Raiz"
license = "MIT OR Apache-2.0"

[[bin]]
name = "pdf2epub"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
lopdf = "0.34"
pdfium-render = { version = "0.8", features = ["thread_safe", "image"] }
rayon = "1.10"
regex = "1.11"
reqwest = { version = "0.12", features = ["blocking", "rustls-tls"] }
scraper = "0.20"
syntect = "5.2"
url = "2.5"
uuid = { version = "1.11", features = ["v4"] }
zip = { version = "2.2", default-features = false, features = ["deflate"] }
